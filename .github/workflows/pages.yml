# Publish the site to GitHub Pages: the committed results page as the index,
# the write-up under blog/ (filled from the committed results), and the
# in-browser demo under demo/ with a cssynth wheel built from this commit. Enable it once under Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: [bench/cssynth-results.html, bench/results.json, bench/ablation.json, bench/build_blog.py, docs/blog/**, demo/**, cssynth/**, pyproject.toml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Assemble the site
        run: |
          mkdir -p site/demo
          cp bench/cssynth-results.html site/index.html
          cp demo/web/* demo/common.py site/demo/
          cp -r demo/examples site/demo/
          pip wheel . --no-deps -w site/demo
          (cd site/demo && ls *.whl > wheel.txt)
          pip install pillow
          python bench/build_blog.py site/blog
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: bench
      - name: Check the demo in Chrome before publishing it (demo/check.js)
        run: |
          python -m http.server 8000 -d site &
          sleep 2
          NODE_PATH=bench/node_modules CHROME_PATH=$(command -v google-chrome) node demo/check.js http://localhost:8000/demo/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
