# Full benchmark on Linux, with the same Chromium build the targets were
# rendered with, plus the rho trade-off table. Run it by hand from the Actions tab.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      research:
        description: "Re-search the N best results (compile_image research=N)"
        default: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -e .
      - run: npm ci
        working-directory: bench
      - run: python bench/fetch.py
      - run: python bench/run.py --research ${{ inputs.research }}
      - run: python bench/tradeoff.py
      - run: python bench/build_page.py
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: |
            bench/results.json
            bench/tradeoff.json
            bench/out/
            bench/cssynth-results.html
