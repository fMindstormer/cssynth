# Full benchmark on Linux, with the same Chromium build the targets were
# rendered with. Takes about half an hour; run it by hand from the Actions tab.
name: Benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -e .
      - run: npm ci
        working-directory: bench
      - run: python bench/fetch.py
      - run: python bench/run.py
      - run: python bench/build_page.py
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: |
            bench/results.json
            bench/out/
            bench/cssynth-results.html
